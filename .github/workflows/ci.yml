name: CI

# Catches the class of break that reached production before (a layer referencing
# a removed variable): the frontend must build and every backend file must parse.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev
        working-directory: backend
      - name: Syntax-check every backend source file
        working-directory: backend
        run: |
          for f in server.js services/*.js; do
            node --check "$f"
          done
